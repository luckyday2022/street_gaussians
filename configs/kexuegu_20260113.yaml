task: kexuegu_full_exp
source_path: /data/cm/split-gaussian/data/20260113/waymo_format/training_set_processed/000
exp_name: kexuegu_train_20260113_000
to_cuda: true

data:
  split_test: -1
  split_train: 1
  type: Kexuegu
  white_background: false
  selected_frames: [650, 700]
  cameras: [0, 1, 2, 3, 4, 5, 6, 7]
  extent: 20
  use_colmap: false
  filter_colmap: false
  box_scale: 1.0
  regenerate_pcd: false

model:
  gaussian:
    sh_degree: 1
    fourier_dim: 5
    fourier_scale: 1.
    flip_prob: 0.
  nsg:
    include_bkgd: true
    include_obj: false
    include_sky: false
    opt_track: false

train:
  iterations: 30000
  test_iterations: [7000, 30000]
  save_iterations: [30000]
  checkpoint_iterations: [30000]

optim:
  prune_box_interval: 100
  densification_interval: 100
  densify_from_iter: 500
  densify_grad_threshold_bkgd: 0.0006
  densify_grad_abs_bkgd: True
  densify_grad_threshold_obj: 0.0002
  densify_grad_abs_obj: False
  densify_until_iter: 25000
  feature_lr: 0.0025
  max_screen_size: 20
  min_opacity: 0.005
  opacity_lr: 0.05
  opacity_reset_interval: 3000
  percent_big_ws: 0.1
  percent_dense: 0.01
  position_lr_delay_mult: 0.01
  position_lr_final: 1.6e-06
  position_lr_init: 0.00016
  position_lr_max_steps: 50000
  rotation_lr: 0.001
  scaling_lr: 0.005
  semantic_lr: 0.01

  lambda_dssim: 0.2
  lambda_sky: 0.0
  lambda_mask: 0.1
  lambda_reg: 0.1
  lambda_depth_lidar: 0.1

render:
  fps: 24
  concat_cameras: [1, 0, 2]
